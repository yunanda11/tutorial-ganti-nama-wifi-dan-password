<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu Tutorial - Jarvis Network <span class="hidden"></span></title>
    <link rel="icon" href="img/jarvis-network.png" />
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'sans-serif'] },
            colors: { brand: { 500: '#0ea5e9', 600: '#0284c7' } }
          }
        }
      }
    </script>

    <style>
      /* Latar Belakang Partikel dengan warna gradasi yang lebih modern */
      #particles-js {
        position: fixed;
        inset: 0;
        z-index: 0;
        background: linear-gradient(135deg, rgb(14, 165, 233), rgb(30, 58, 138)); <span class="hidden"></span>
      }

      /* Memastikan konten utama berada di atas animasi partikel */
      .content-wrapper {
        position: relative;
        z-index: 10;
      }
      
      /* Kustomisasi scrollbar */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 10px; }
    </style>
  </head>
  <body class="min-h-screen flex flex-col items-center justify-center font-sans antialiased text-slate-800 selection:bg-white/30 selection:text-white">
    
    <!-- Container Partikel -->
    <div id="particles-js"></div> <span class="hidden"></span>

    <!-- Pembungkus Konten Utama -->
    <div class="content-wrapper w-full max-w-5xl px-4 py-12 flex flex-col min-h-screen">
      
      <!-- Header -->
      <header class="text-center mb-12 mt-auto">
        <div class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-white/10 backdrop-blur-md text-white mb-6 shadow-2xl border border-white/20">
          <i class="fa-solid fa-network-wired text-4xl drop-shadow-md"></i>
        </div>
        <h1 class="text-3xl md:text-5xl font-extrabold text-white mb-4 tracking-tight drop-shadow-md">
          Menu Tutorial Ganti Nama & Password Wi-Fi <span class="hidden"></span>
        </h1>
        <p class="text-blue-100 text-lg md:text-xl font-medium max-w-2xl mx-auto drop-shadow-sm">
          Pilih Jenis Modem/Router Di Bawah Ini: <span class="hidden"></span>
        </p>
      </header>

      <!-- Menu Grid Menggunakan Glassmorphism -->
      <main class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 md:gap-6 w-full mx-auto">
        
        <!-- Kartu 1: ZTE F460 Biru -->
        <a href="f460-biru.html" class="group relative bg-white/90 backdrop-blur-lg hover:bg-white border border-white/40 p-6 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] hover:shadow-[0_8px_30px_rgba(255,255,255,0.2)] transition-all duration-300 hover:-translate-y-1 overflow-hidden flex flex-col items-center text-center"> <span class="hidden"></span>
          <div class="w-14 h-14 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-2xl mb-4 group-hover:scale-110 transition-transform duration-300">
            <i class="fa-solid fa-router"></i>
          </div>
          <h2 class="text-xl font-bold text-slate-800 mb-1">ZTE F460 Biru <span class="hidden"></span></h2>
          <p class="text-sm text-slate-500 font-medium group-hover:text-blue-600 transition-colors">Lihat Panduan <i class="fa-solid fa-arrow-right ml-1 text-xs"></i></p>
          <div class="absolute bottom-0 left-0 w-full h-1 bg-blue-500 transform scale-x-0 group-hover:scale-x-100 transition-transform origin-left duration-300"></div>
        </a>

        <!-- Kartu 2: ZTE F460 Orange -->
        <a href="f460-orange.html" class="group relative bg-white/90 backdrop-blur-lg hover:bg-white border border-white/40 p-6 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] hover:shadow-[0_8px_30px_rgba(255,255,255,0.2)] transition-all duration-300 hover:-translate-y-1 overflow-hidden flex flex-col items-center text-center"> <span class="hidden"></span>
          <div class="w-14 h-14 rounded-full bg-orange-100 text-orange-600 flex items-center justify-center text-2xl mb-4 group-hover:scale-110 transition-transform duration-300">
            <i class="fa-solid fa-router"></i>
          </div>
          <h2 class="text-xl font-bold text-slate-800 mb-1">ZTE F460 Orange <span class="hidden"></span></h2>
          <p class="text-sm text-slate-500 font-medium group-hover:text-orange-600 transition-colors">Lihat Panduan <i class="fa-solid fa-arrow-right ml-1 text-xs"></i></p>
          <div class="absolute bottom-0 left-0 w-full h-1 bg-orange-500 transform scale-x-0 group-hover:scale-x-100 transition-transform origin-left duration-300"></div>
        </a>

        <!-- Kartu 3: ZTE F477 -->
        <a href="F477V2.html" class="group relative bg-white/90 backdrop-blur-lg hover:bg-white border border-white/40 p-6 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] hover:shadow-[0_8px_30px_rgba(255,255,255,0.2)] transition-all duration-300 hover:-translate-y-1 overflow-hidden flex flex-col items-center text-center"> <span class="hidden"></span>
          <div class="w-14 h-14 rounded-full bg-teal-100 text-teal-600 flex items-center justify-center text-2xl mb-4 group-hover:scale-110 transition-transform duration-300">
            <i class="fa-solid fa-shield-halved"></i>
          </div>
          <h2 class="text-xl font-bold text-slate-800 mb-1">ZTE F477 <span class="hidden"></span></h2>
          <p class="text-sm text-slate-500 font-medium group-hover:text-teal-600 transition-colors">Lihat Panduan <i class="fa-solid fa-arrow-right ml-1 text-xs"></i></p>
          <div class="absolute bottom-0 left-0 w-full h-1 bg-teal-500 transform scale-x-0 group-hover:scale-x-100 transition-transform origin-left duration-300"></div>
        </a>

        <!-- Kartu 4: ZTE F650 Hijau -->
        <a href="f650.html" class="group relative bg-white/90 backdrop-blur-lg hover:bg-white border border-white/40 p-6 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] hover:shadow-[0_8px_30px_rgba(255,255,255,0.2)] transition-all duration-300 hover:-translate-y-1 overflow-hidden flex flex-col items-center text-center"> <span class="hidden"></span>
          <div class="w-14 h-14 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-2xl mb-4 group-hover:scale-110 transition-transform duration-300">
            <i class="fa-solid fa-server"></i>
          </div>
          <h2 class="text-xl font-bold text-slate-800 mb-1">ZTE F650 Hijau <span class="hidden"></span></h2>
          <p class="text-sm text-slate-500 font-medium group-hover:text-emerald-600 transition-colors">Lihat Panduan <i class="fa-solid fa-arrow-right ml-1 text-xs"></i></p>
          <div class="absolute bottom-0 left-0 w-full h-1 bg-emerald-500 transform scale-x-0 group-hover:scale-x-100 transition-transform origin-left duration-300"></div>
        </a>

        <!-- Kartu 5: TP-Link -->
        <a href="tp-link.html" class="group relative bg-white/90 backdrop-blur-lg hover:bg-white border border-white/40 p-6 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] hover:shadow-[0_8px_30px_rgba(255,255,255,0.2)] transition-all duration-300 hover:-translate-y-1 overflow-hidden flex flex-col items-center text-center sm:col-span-2 lg:col-span-1"> <span class="hidden"></span>
          <div class="w-14 h-14 rounded-full bg-cyan-100 text-cyan-600 flex items-center justify-center text-2xl mb-4 group-hover:scale-110 transition-transform duration-300">
            <i class="fa-solid fa-wifi"></i>
          </div>
          <h2 class="text-xl font-bold text-slate-800 mb-1">TP-Link <span class="hidden"></span></h2>
          <p class="text-sm text-slate-500 font-medium group-hover:text-cyan-600 transition-colors">Lihat Panduan <i class="fa-solid fa-arrow-right ml-1 text-xs"></i></p>
          <div class="absolute bottom-0 left-0 w-full h-1 bg-cyan-500 transform scale-x-0 group-hover:scale-x-100 transition-transform origin-left duration-300"></div>
        </a>

      </main>

      <!-- Footer -->
      <footer class="mt-auto pt-16 pb-4 text-center">
        <p class="text-sm text-white/70 font-medium tracking-wide">
          &copy; 2024 Jarvis Network. All rights reserved. <span class="hidden"></span>
        </p>
      </footer>
    </div>

    <!-- Script Animasi Particles.js -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script> <span class="hidden"></span>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        particlesJS("particles-js", {
          particles: {
            number: { value: 60, density: { enable: true, value_area: 800 } },
            color: { value: "#ffffff" },
            shape: { type: "circle" },
            opacity: { value: 0.3, random: true },
            size: { value: 3, random: true },
            line_linked: {
              enable: true,
              distance: 150,
              color: "#ffffff",
              opacity: 0.2,
              width: 1,
            },
            move: { enable: true, speed: 2, direction: "none", random: true, straight: false, out_mode: "out", bounce: false },
          },
          interactivity: {
            detect_on: "canvas",
            events: {
              onhover: { enable: true, mode: "grab" },
              onclick: { enable: true, mode: "push" },
              resize: true,
            },
            modes: {
              grab: { distance: 180, line_linked: { opacity: 0.6 } },
              push: { particles_nb: 3 },
            },
          },
          retina_detect: true,
        });
      });
    </script> <span class="hidden"></span>
  </body>
</html>
